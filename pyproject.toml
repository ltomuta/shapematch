[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shapematch"
version = "1.0.0b6"
description = "Headless STEP geometry feature extraction and SVD shape matching"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}
authors = [{name = "Toby Borland", email = "tobyborland@live.com"}]
keywords = ["registration", "CAD", "STEP", "OpenCASCADE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cadquery-ocp==8.0.1.1.0",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "opencv-python-headless>=4.8,<6",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "plotly>=6,<7", "fastapi>=0.115,<1", "httpx>=0.27,<1", "platformdirs>=4,<5"]
html = ["plotly>=6,<7"]
app = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "platformdirs>=4,<5", "plotly>=6,<7"]
reference = ["dill>=0.3.8,<0.5"]

[project.urls]
Homepage = "https://github.com/TobyBorland/shapematch"
Issues = "https://github.com/TobyBorland/shapematch/issues"

[project.scripts]
shapematch = "shapematch:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["shapematch", "shapematch_geometry", "shapematch_alignment", "shapematch_cache", "shapematch_workflows", "shapematch_html", "shapematch_boolean"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["shapematch_app*"]

[tool.setuptools.package-data]
shapematch_app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: full feature extraction and CLI workflows"]
