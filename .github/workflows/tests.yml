name: Standalone cross-platform
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[app,test]' build
      - run: python -m pytest -q
      - run: python -m build
      # Python expands the wheel path on both PowerShell and POSIX shells.
      - run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', *glob.glob('dist/*.whl')])"
      - run: shapematch --help
      - run: python -m shapematch --help
      - run: shapematch app --help
      - run: python tools/app_smoke.py
